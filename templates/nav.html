<nav
  class="navbar navbar-expand-lg navbar-dark"
  style="background: linear-gradient(90deg, #0f172a, #1d4ed8); box-shadow: 0 12px 30px rgba(15,23,42,0.8);"
>
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="{% url 'home' %}">Student Portal</a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'about' %}">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'contact' %}">Contact</a>
        </li>
        {% if user.is_authenticated %}
        <li class="nav-item">
          <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'student_list' %}">Students</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'location_dropdown' %}">Locations</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'user_list' %}">Users</a>
        </li>
        {% endif %}
      </ul>
      <div class="d-flex gap-2">
        {% if user.is_authenticated %}
        <span class="navbar-text">Hi, {{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="btn btn-outline-danger btn-sm" type="submit">Logout</button>
        </form>
        {% else %}
        <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Login</a>
        <a class="btn btn-primary btn-sm" href="{% url 'register' %}">Register</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
