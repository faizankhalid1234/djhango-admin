{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card p-4 p-md-5 shadow-lg">
      <h2 class="page-title mb-2 text-center">Create an Account</h2>
      <p class="page-subtitle small text-center mb-4">
        Register and then log in to work with student records.
      </p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success w-100 mt-3">Sign up</button>
      </form>
      <p class="mt-4 mb-0 text-center small">
        Already registered?
        <a href="{% url 'login' %}">Login</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
