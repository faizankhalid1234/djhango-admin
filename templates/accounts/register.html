{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card p-4 shadow-lg">
      <h2 class="mb-3 text-center">Create an Account</h2>
      <p class="text-muted small text-center mb-3">
        Register and then log in to work with student records.
      </p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success w-100 mt-2">Sign up</button>
      </form>
      <p class="mt-3 mb-0 text-center small">
        Already registered?
        <a href="{% url 'login' %}">Login</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
