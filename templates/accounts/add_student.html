{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <h2 class="page-title mb-1">Add Student ({{ view_type }})</h2>
    <p class="page-subtitle mb-3">Fill student details and upload profile image.</p>
    <form method="post" enctype="multipart/form-data" class="card p-4 p-md-5">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Save Student</button>
        <a href="{% url 'student_list' %}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
