{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 p-md-5 shadow-lg">
      <h2 class="page-title mb-2 text-center">Welcome Back</h2>
      <p class="page-subtitle small text-center mb-4">
        Sign in to access dashboard and manage students.
      </p>
      <form method="post" class="mt-2">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100 mt-3">Login</button>
      </form>
      <p class="mt-4 mb-0 text-center small">
        New here?
        <a href="{% url 'register' %}">Create an account</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
